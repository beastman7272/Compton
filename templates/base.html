<!doctype html>
<html lang="en">
<head>

    <title>Compton CQE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="layout">

            <div class="logo-bars">
                <span></span><span></span><span></span><span></span>

                <div class="logo-title">Compton</div>

        </div>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('search_results') }}">Search Results</a>
            <a href="{{ url_for('projects') }}">Projects</a>
            <a href="{{ url_for('search_filters') }}">Search Filters</a>
        </nav>
    </aside>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
